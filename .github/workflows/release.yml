name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 0.3.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  package-macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-aarch64
            script: ./scripts/package-darwin-aarch64.sh
          - name: darwin-x86_64
            script: ./scripts/package-darwin-x86_64.sh
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Package macOS DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOCACHE: ${{ runner.temp }}/go-build-cache
        run: ${{ matrix.script }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: investgo-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: |
            build/bin/*.dmg
            build/bin/*.zip
          if-no-files-found: error

  package-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows executable
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOCACHE: ${{ runner.temp }}\go-build-cache
        shell: pwsh
        run: |
          $output = Join-Path $PWD "build/bin/investgo-$env:VERSION-windows-amd64.exe"
          .\scripts\build-windows-amd64.ps1 -Version $env:VERSION -AppVersion $env:VERSION -OutputFile $output

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: investgo-${{ needs.version.outputs.version }}-windows-amd64
          path: build/bin/*.exe
          if-no-files-found: error

  publish:
    needs: [version, package-macos, package-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [[ -n "$previous_tag" ]]; then
              printf "## What's Changed\n\n"
              git log --no-merges --reverse --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "${previous_tag}..${GITHUB_REF_NAME}"
              printf "\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n" "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME"
            else
              printf "Initial release.\n"
            fi
          } > release-notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files found in dist/" >&2
            ls -la dist >&2 || true
            exit 1
          fi
          (cd dist && sha256sum "${files[@]##*/}" >checksums.txt)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${files[@]}" \
            dist/checksums.txt
