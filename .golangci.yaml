version: '2'

run:
    timeout: 10m

linters:
    default: standard
    enable:
        - bodyclose
        - contextcheck
        - errorlint
        - nilerr
        - sqlclosecheck

    settings:
        errcheck:
            check-type-assertions: true
            check-blank: true
        staticcheck:
            checks:
                - all
                - -ST1000
                - -ST1003
                - -ST1005
                - -ST1020
                - -ST1021

    exclusions:
        generated: lax
        rules:
            - path: '_test\.go$'
              linters: [errcheck]

formatters:
    enable:
        - gofmt

issues:
    max-issues-per-linter: 0
    max-same-issues: 0
